			function RafraichirMenuGaucheIci()
			{
				//[B8392] - J'ai ajouté un petit check et un try catch quand on va chercher le frame. Si jamais on ne le trouve pas on ne va pas faire l'appel de la fonction.
				var doSelection = false;
				try
				{
					doSelection = (window.top && window.top.frames[1] && window.top.frames[1].name == 'frGauche' && (typeof window.top.frames[1].SelectionneItem == 'function'));
				}
				catch (e)
				{
					doSelection = false;
				}

				if (doSelection)
				{
					window.top.frames[1].SelectionneItem(document.getElementById('frMilieu').contentWindow.document.URL);
				}	
			}
        	
		</script>
